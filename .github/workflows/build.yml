name: Build and Deploy

on:
  push:
    branches:
      - Release

jobs:
  build:
    runs-on: home-prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>Snapshots</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>Releases</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>main</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>main</id>
                <mirrorOf>central</mirrorOf>
                <url>http://nexus.jbrmmg.me.uk:8081/repository/maven-public/</url>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>default</id>
                <properties>
                  <repository.url>http://nexus.jbrmmg.me.uk:8081/repository</repository.url>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>default</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build with Maven
        run: mvn verify

      - name: Build Docker image
        run: |
          docker build \
            -f src/main/resources/docker/Dockerfile \
            -t nexus.jbrmmg.me.uk:8083/home:${{ github.sha }} \
            -t nexus.jbrmmg.me.uk:8083/home:latest \
            .

      - name: Push to Nexus Docker registry
        run: |
          docker login nexus.jbrmmg.me.uk:8083 \
            -u deployment \
            -p ${{ secrets.NEXUS_PASSWORD }}
          docker push nexus.jbrmmg.me.uk:8083/home:${{ github.sha }}
          docker push nexus.jbrmmg.me.uk:8083/home:latest

      - name: Deploy
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_KEY: ${{ secrets.EMAIL_KEY }}
        run: |
          docker login nexus.jbrmmg.me.uk:8084 \
            -u deployment \
            -p ${{ secrets.NEXUS_PASSWORD }}
          echo "SMTP_PASSWORD=${SMTP_PASSWORD}" > .env
          echo "EMAIL_KEY=${EMAIL_KEY}" >> .env
          docker compose pull
          docker compose up -d
