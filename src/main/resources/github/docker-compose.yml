services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: home-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/jbrmmg/Home
      RUNNER_TOKEN: ACY7E264UORFK5A6HIONQXLKGAB3M
      RUNNER_NAME: home-runner
      RUNNER_WORKDIR: /tmp/runner/work
      LABELS: self-hosted
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/runner/work

volumes:
  runner-work: